# No default passwords. Copy VisioAudit-Infra/.env.example to .env first.
# `docker compose up` also loads compose.override.yaml (bind mounts, loopback datastore ports).
# Skip the override with: docker compose -f compose.yaml up --build

name: visioaudit

# Secrets are loaded from VisioAudit-Infra/.env via env_file.
# Connection URLs are assembled in the backend entrypoint. Do not inline them here.
x-backend-env: &backend-env
  POSTGRES_HOST: db
  REDIS_HOST: redis
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: audits
  USER_AGENT: SanneticVisionBot/1.0 (+https://sannetic.com/bot)
  CRAWL_DELAY_SECONDS: "0.5"
  CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
  LOG_LEVEL: info
  LOG_FORMAT: console
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  MAX_PAGES_CAP: ${MAX_PAGES_CAP:-500}
  MAX_LINK_PROBES: ${MAX_LINK_PROBES:-200}

services:
  db:
    image: postgres:17.12-bookworm
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    env_file:
      - .env
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    entrypoint: ["/usr/local/bin/visio-redis.sh"]
    volumes:
      - redis-data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/visio-redis.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: visioaudit-minio:local
    env_file:
      - .env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: visioaudit-backend:local
    env_file:
      - .env
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  worker:
    image: visioaudit-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: ["python", "-m", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: visioaudit-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: ["python", "-m", "celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    image: visioaudit-frontend:local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
