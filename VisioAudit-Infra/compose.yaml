# Development credential fallbacks let `docker compose up` start without a copied .env.
# Replace them via VisioAudit-Infra/.env before any shared or production use.
# `docker compose up` also loads compose.override.yaml (bind mounts, loopback datastore ports).
# Skip the override with: docker compose -f compose.yaml up --build

name: visioaudit

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visio}:${POSTGRES_PASSWORD:-REDACTED}@db:5432/${POSTGRES_DB:-visioaudit}
  CELERY_BROKER_URL: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-visioaudit}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-REDACTED}
  S3_BUCKET: audits
  USER_AGENT: SanneticVisionBot/1.0 (+https://sannetic.com/bot)
  CRAWL_DELAY_SECONDS: "0.5"
  CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
  LOG_LEVEL: info
  LOG_FORMAT: console
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REDACTED}
      POSTGRES_DB: ${POSTGRES_DB:-visioaudit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visio} -d ${POSTGRES_DB:-visioaudit}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: visioaudit-minio:local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visioaudit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-REDACTED}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: visioaudit-backend:local
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  worker:
    image: visioaudit-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    command: ["python", "-m", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    image: visioaudit-frontend:local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
