# Loaded automatically next to compose.yaml.
# Bind mounts and loopback ports are for local development.

services:
  api:
    user: "0:0"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ../backend:/app
    environment:
      LOG_LEVEL: debug

  worker:
    volumes:
      - ../backend:/app

  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:63799:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  frontend:
    image: visioaudit-frontend:dev
    build:
      target: dev
    volumes:
      - ../frontend:/src
      - frontend-modules:/src/node_modules
      - frontend-next:/src/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    healthcheck:
      start_period: 90s

volumes:
  frontend-modules:
  frontend-next:
