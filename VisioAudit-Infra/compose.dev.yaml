# Local development. Not loaded automatically.
# docker compose -f compose.dev.yaml up --build
# Publishes ports on 127.0.0.1 only. Source is bind-mounted. API docs and reload are on.
# COOKIE_SECURE is false because the published ports are plain HTTP.

name: visioaudit

x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:?required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  POSTGRES_DB: ${POSTGRES_DB:?required}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: audits
  USER_AGENT: SanneticVisionBot/1.0 (+https://sannetic.com/bot)
  CRAWL_DELAY_SECONDS: "0.5"
  CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  LOG_LEVEL: info
  LOG_FORMAT: console
  EXPOSE_DOCS: "true"
  DEBUG: "false"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  AUTH_SECRET: ${AUTH_SECRET:?required}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?required}
  AGENCY_EMAIL: ${AGENCY_EMAIL:?required}
  AGENCY_PASSWORD: ${AGENCY_PASSWORD:?required}
  AGENCY_NAME: ${AGENCY_NAME:-Agentur}
  LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  MAX_PAGES_CAP: ${MAX_PAGES_CAP:-500}
  MAX_LINK_PROBES: ${MAX_LINK_PROBES:-200}

services:
  db:
    image: postgres:17.12-bookworm
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    env_file:
      - path: .env
        required: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    entrypoint: ["/usr/local/bin/visio-redis.sh"]
    volumes:
      - redis-data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/visio-redis.sh:ro
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: visioaudit-minio:local
    env_file:
      - path: .env
        required: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: visioaudit-backend:local
    env_file:
      - path: .env
        required: true
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ../backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  worker:
    image: visioaudit-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      <<: *backend-env
    command: ["python", "-m", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - ../backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: visioaudit-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      <<: *backend-env
    command: ["python", "-m", "celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info"]
    volumes:
      - ../backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    image: visioaudit-frontend:dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ../frontend:/src
      - frontend-modules:/src/node_modules
      - frontend-next:/src/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  frontend-modules:
  frontend-next:
