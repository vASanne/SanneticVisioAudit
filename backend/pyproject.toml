[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
# German copy uses typographic dashes and quotation marks on purpose.
allowed-confusables = ["–", "„", "“"]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "ASYNC",
    "BLE",  # blind except
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert as its assertion API.
"tests/**/*.py" = ["S101"]
# The management CLI writes operator messages, including the one-time secret, to the terminal.
"app/cli.py" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
files = ["app", "tests", "alembic"]
