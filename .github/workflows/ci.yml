name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install and test
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, test, and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit
        run: |
          python -m pip install bandit
          bandit -r backend/app -ll -ii -q

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --config p/javascript --config p/typescript --config p/owasp-top-ten --metrics=off --error --severity ERROR

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --requirement backend/requirements.lock --progress-spinner off

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          version=8.24.3
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
